# Vigilo — stack do projeto sobre a infra existente (Traefik + MySQL + Redis).
# Copie este arquivo para ~/apps/vigilo/docker-compose.yml (ao lado da pasta src/):
#   cp src/deploy/docker-compose.yml ~/apps/vigilo/
# Os caminhos ./src abaixo assumem que o compose roda em ~/apps/vigilo/.
services:
  app:
    build:
      context: ./src/deploy
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    networks: [data]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./src:/var/www
      - ./src/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, data]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vigilo.rule=Host(`vigilosecure.com`) || Host(`www.vigilosecure.com`) || Host(`vigilo.hygnuz.cloud`)"
      - "traefik.http.routers.vigilo.entrypoints=websecure"
      - "traefik.http.routers.vigilo.tls.certresolver=le"
      - "traefik.http.routers.vigilo.middlewares=vigilo-redir"
      - "traefik.http.middlewares.vigilo-redir.redirectregex.regex=^https://(www\\.vigilosecure\\.com|vigilo\\.hygnuz\\.cloud)/(.*)"
      - "traefik.http.middlewares.vigilo-redir.redirectregex.replacement=https://vigilosecure.com/$${2}"
      - "traefik.http.middlewares.vigilo-redir.redirectregex.permanent=true"
      - "traefik.docker.network=web"

  queue:
    build:
      context: ./src/deploy
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./src:/var/www
    networks: [data]

  scheduler:
    build:
      context: ./src/deploy
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
    networks: [data]

  # Base CNPJ consolidada da Receita (V2) — PostgreSQL proprio, so na rede interna.
  # Alimentado pelo pipeline de dump (ver docs/vigilo-v2-f1-runbook.md).
  # Usuario/senha vem de ~/apps/vigilo/.env (o mesmo CNPJ_DB_* do src/.env):
  #   CNPJ_DB_USERNAME=cnpj
  #   CNPJ_DB_PASSWORD=<senha forte>
  postgres:
    image: postgres:17-alpine
    container_name: data-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: cnpj
      POSTGRES_USER: ${CNPJ_DB_USERNAME:-cnpj}
      POSTGRES_PASSWORD: ${CNPJ_DB_PASSWORD:?defina CNPJ_DB_PASSWORD em ~/apps/vigilo/.env}
    volumes:
      - cnpj-pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CNPJ_DB_USERNAME:-cnpj} -d cnpj"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  cnpj-pgdata:

networks:
  web:
    external: true
  data:
    external: true
