# Postgres da base CNPJ — VM Oracle A1 (4 OCPU / 24 GB, block volume Balanced).
# Arquivo completo (config_file): o que não está aqui fica no padrão do PG 17.

listen_addresses = '0.0.0.0'    # só IPv4; quem entra: Security List + iptables + pg_hba
port = 5432
max_connections = 100
hba_file = '/etc/postgresql/pg_hba.conf'

# TLS obrigatório para o VPS (o pg_hba só aceita hostssl de fora).
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# Memória (24 GB na VM). shared_buffers alto também mantém a memória acima de
# 20% — um dos critérios de "VM ociosa" da Oracle.
shared_buffers = 6GB
effective_cache_size = 16GB
work_mem = 32MB
maintenance_work_mem = 1GB
dynamic_shared_memory_type = posix

# Escrita: o upsert mensal reescreve a base inteira.
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Disco de rede SSD (block volume) e 4 núcleos.
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Log: conexões (auditoria de quem entra) e consultas lentas.
log_connections = on
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d %h '
log_timezone = 'UTC'

# Igual ao Postgres do VPS (padrão da imagem).
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
