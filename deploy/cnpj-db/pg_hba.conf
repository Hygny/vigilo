# Quem pode conectar na base CNPJ. Tudo que não casar aqui é recusado.
# O IP do VPS é trocado pelo provisionar-vm.sh (placeholder VPS_IP).

# TYPE   DATABASE  USER        ADDRESS           METHOD
# Socket dentro do container (docker exec: pg_dump, psql, pf-count.sh).
local    all       all                           trust
# Pipeline da Receita rodando na própria VM (rede do host), como superuser.
host     all       all         127.0.0.1/32      scram-sha-256
# App no VPS — só com TLS e só com o papel NÃO-superuser (bin/papel-app.sh).
hostssl  cnpj      vigilo_app  VPS_IP/32         scram-sha-256
