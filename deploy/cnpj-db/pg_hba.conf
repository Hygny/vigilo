# Quem pode conectar na base CNPJ. Tudo que não casar aqui é recusado.
# O IP do VPS é trocado pelo provisionar-vm.sh (placeholder VPS_IP).

# TYPE   DATABASE  USER  ADDRESS           METHOD
# Socket dentro do container (docker exec: pg_dump, psql, pf-count.sh).
local    all       all                     trust
# Pipeline da Receita rodando na própria VM (rede do host).
host     all       all   127.0.0.1/32      scram-sha-256
# App no VPS — só com TLS.
hostssl  cnpj      cnpj  VPS_IP/32         scram-sha-256
